name: Build Android APK

on:
  push:
  workflow_dispatch:

env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Bundle fonts for offline use
        run: |
          mkdir -p www/fonts
          cp node_modules/@fontsource/poppins/files/poppins-latin-{400,500,600}-normal.woff2 www/fonts/
          cp node_modules/@fontsource/outfit/files/outfit-latin-{400,500}-normal.woff2 www/fonts/

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Set app name, vibration and microphone
        run: |
          sed -i "s/Hemans Calc/Heman’s Calc/g" android/app/src/main/res/values/strings.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Copy web files into the app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build and sign release APK
        if: env.KEYSTORE_BASE64 != ''
        run: |
          (cd android && ./gradlew assembleRelease)
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out Hemans-Calc-release.apk aligned.apk
          $BT/apksigner verify Hemans-Calc-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hemans-calc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: hemans-calc-release-apk
          path: Hemans-Calc-release.apk
